<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & ML Learning Hub</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --surface: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            
            --btn-again: #ef4444;
            --btn-hard: #f59e0b;
            --btn-good: #10b981;
            --btn-easy: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        .header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
        select { padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); font-size: 16px; flex-grow: 1; min-width: 200px;}
        
        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .toggle-btn { background: var(--surface); border: 1px solid var(--border); padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.2s; }
        .toggle-btn:hover { background: #f9fafb; }
        .toggle-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .stats { width: 100%; max-width: 900px; text-align: center; font-size: 16px; color: var(--text-muted); margin-bottom: 20px; font-weight: 500;}

        #workspace { width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; }

        .card-container { width: 100%; perspective: 1000px; margin-bottom: 25px; }
        .card { width: 100%; min-height: 450px; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: var(--surface); border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); padding: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 1px solid var(--border); overflow-y: auto; }
        .card-back { transform: rotateY(180deg); }

        .question-text, .answer-text { font-size: 22px; line-height: 1.5; font-weight: 500; margin: auto 0; width: 100%; }
        .answer-text { font-weight: 400; font-size: 20px; }

        .feynman-draft { width: 100%; margin-top: 20px; flex-shrink: 0; }
        .feynman-draft textarea { width: 100%; height: 100px; padding: 15px; border-radius: 8px; border: 1px solid var(--border); resize: none; font-family: inherit; font-size: 16px; }

        .actions { width: 100%; display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
        .btn { padding: 16px 24px; border: none; border-radius: 10px; font-size: 18px; font-weight: 600; cursor: pointer; color: white; transition: opacity 0.2s, transform 0.1s; }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); width: 100%; }
        
        .sm2-buttons { display: none; width: 100%; gap: 12px; justify-content: space-between; }
        .btn-sm2 { 
            flex: 1; 
            padding: 14px 8px; 
            font-size: 15px; 
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
            text-align: center;
        }
        .bg-again { background-color: var(--btn-again); }
        .bg-hard { background-color: var(--btn-hard); color: #fff; }
        .bg-good { background-color: var(--btn-good); }
        .bg-easy { background-color: var(--btn-easy); }

        .empty-state { text-align: center; padding: 50px; background: var(--surface); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 100%; }
        
        @media (max-width: 768px) {
            .card-face { padding: 30px; }
            .question-text, .answer-text { font-size: 20px; }
            .controls { justify-content: center; width: 100%; }
        }

        @media (max-width: 600px) {
            .card-face { padding: 25px; }
            .question-text, .answer-text { font-size: 18px; }
            .sm2-buttons { gap: 8px; flex-wrap: wrap; }
            .btn-sm2 { flex-basis: 45%; min-height: 60px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <select id="deck-selector"></select>
        <div class="controls">
            <button id="export-btn" class="toggle-btn" title="Сохранить прогресс">📤 Экспорт</button>
            <button id="import-btn" class="toggle-btn" title="Загрузить прогресс">📥 Импорт</button>
            <button id="reverse-toggle" class="toggle-btn">Reverse Mode</button>
        </div>
    </div>

    <div class="stats" id="stats-display">
        Осталось на сегодня: <span id="queue-count">0</span>
    </div>

    <div id="workspace">
        <div class="card-container" id="card-container">
            <div class="card" id="flashcard">
                <div class="card-face card-front">
                    <div class="question-text" id="front-text"></div>
                    <div class="feynman-draft">
                        <textarea id="draft-input" placeholder="Метод Фейнмана: коротко запишите суть ответа до проверки..."></textarea>
                    </div>
                </div>
                <div class="card-face card-back">
                    <div class="answer-text" id="back-text"></div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button id="show-answer-btn" class="btn btn-primary">Показать ответ</button>
            <div class="sm2-buttons" id="sm2-buttons">
                <button class="btn btn-sm2 bg-again" onclick="handleRating(0)">Снова<br>(<1м)</button>
                <button class="btn btn-sm2 bg-hard" onclick="handleRating(1)">Трудно<br>(дней)</button>
                <button class="btn btn-sm2 bg-good" onclick="handleRating(2)">Хорошо<br>(дней)</button>
                <button class="btn btn-sm2 bg-easy" onclick="handleRating(3)">Легко<br>(дней)</button>
            </div>
        </div>
    </div>

    <script>
        const RAW_DECKS = [
            {
                id: "deck_skills",
                title: "AI Agent Skills (IBM)",
                cards: [
                    { id: "s1", front: "Какую главную проблему решают навыки (AI Agent Skills)?", back: "Нехватку процедурного знания — понимания пошаговых регламентов выполнения конкретных рабочих процессов." },
                    { id: "s2", front: "Назовите два обязательных поля в YAML Front Matter файла skill.md.", back: "name (идентификатор) и description (триггер для активации навыка LLM-агентом)." },
                    { id: "s3", front: "Что загружается на Уровне 1 (Tier 1) механизма Progressive Disclosure?", back: "Только метаданные: name и description всех навыков. Это экономит контекстное окно модели при старте." },
                    { id: "s4", front: "В чем разница между MCP и Skills?", back: "MCP дает доступ к инструментам/API, а Skills указывают агенту, КОГДА и КАК именно (в каком порядке) эти инструменты вызывать." },
                    { id: "s5", front: "Почему сторонние навыки могут быть опасны?", back: "Они могут содержать исполняемый код с доступом к файловой системе и API ключам, что создает риск prompt injection и malware." }
                ]
            },
            {
                id: "deck_micrograd",
                title: "Micrograd & NNs (Karpathy)",
                cards: [
                    { id: "m1", front: "За что отвечает класс Value в Micrograd?", back: "Оборачивает число, сохраняет операцию и ссылки на родительские узлы (children), формируя граф вычислений для автодифференцирования." },
                    { id: "m2", front: "Чему равна производная функции потерь по отношению к самой себе (dL/dL) на старте обратного прохода?", back: "1.0. Это базовая точка входа для начала применения цепного правила (Chain Rule)." },
                    { id: "m3", front: "Как работает узел сложения (Plus node) при обратном распространении ошибки?", back: "Он работает как «маршрутизатор»: просто копирует пришедший в него глобальный градиент и передает его всем своим дочерним узлам без изменений." },
                    { id: "m4", front: "Зачем нужна топологическая сортировка графа перед вызовом backward()?", back: "Чтобы гарантировать, что градиент для узла вычисляется только ПОСЛЕ того, как вычислены градиенты всех узлов, зависящих от него (движение строго от конца к началу)." },
                    { id: "m5", front: "Что произойдет, если не вызвать zero_grad() перед следующим шагом оптимизации (backward)?", back: "Градиенты с прошлого шага не обнулятся, а приплюсуются к новым (операция +=), что приведет к неверному обновлению весов и поломке обучения." }
                ]
            }
        ];

        let currentDeckId = "deck_skills";
        let isReverseMode = false;
        let todayQueue = [];
        let currentCard = null;
        let isFlipped = false;
        
        function loadProgress() {
            const saved = localStorage.getItem('ai_hub_progress');
            return saved ? JSON.parse(saved) : {};
        }

        function saveProgress(progressData) {
            localStorage.setItem('ai_hub_progress', JSON.stringify(progressData));
        }

        function getCardStats(deckId, cardId) {
            const progress = loadProgress();
            if (!progress[deckId]) progress[deckId] = {};
            if (!progress[deckId][cardId]) {
                return { reps: 0, interval: 0, ease: 2.5, nextReview: Date.now() };
            }
            return progress[deckId][cardId];
        }

        function updateCardStats(deckId, cardId, rating) {
            let stats = getCardStats(deckId, cardId);
            
            if (rating === 0) {
                stats.reps = 0;
                stats.interval = 1;
            } else {
                if (stats.reps === 0) stats.interval = 1;
                else if (stats.reps === 1) stats.interval = 6;
                else stats.interval = Math.round(stats.interval * stats.ease);
                stats.reps++;
            }

            const q = rating === 0 ? 0 : rating === 1 ? 3 : rating === 2 ? 4 : 5;
            stats.ease = stats.ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
            if (stats.ease < 1.3) stats.ease = 1.3;

            const DAY_IN_MS = 24 * 60 * 60 * 1000;
            stats.nextReview = rating === 0 ? Date.now() + (5 * 60 * 1000) : Date.now() + (stats.interval * DAY_IN_MS);

            const progress = loadProgress();
            if (!progress[deckId]) progress[deckId] = {};
            progress[deckId][cardId] = stats;
            saveProgress(progress);
        }

        function calculateInterval(stats, rating) {
            if (rating === 0) return "<10м";
            if (stats.reps === 0) return "1д";
            if (stats.reps === 1) return "6д";
            return Math.round(stats.interval * (rating === 1 ? 1.2 : rating === 3 ? stats.ease * 1.3 : stats.ease)) + "д";
        }

        function initApp() {
            const selector = document.getElementById('deck-selector');
            RAW_DECKS.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.title;
                selector.appendChild(opt);
            });

            selector.addEventListener('change', (e) => {
                currentDeckId = e.target.value;
                buildQueue();
            });

            document.getElementById('reverse-toggle').addEventListener('click', (e) => {
                isReverseMode = !isReverseMode;
                e.target.classList.toggle('active');
                buildQueue();
            });
            
            // Логика экспорта
            document.getElementById('export-btn').addEventListener('click', () => {
                const data = localStorage.getItem('ai_hub_progress');
                if (!data || data === '{}') {
                    alert('Нет данных для экспорта. Пройдите хотя бы одну карточку.');
                    return;
                }
                const encoded = btoa(encodeURIComponent(data));
                navigator.clipboard.writeText(encoded).then(() => {
                    alert('✅ Прогресс скопирован в буфер обмена!\n\nОтправьте этот код себе в Telegram (или заметки), чтобы потом импортировать на другом устройстве.');
                }).catch(() => {
                    prompt('Скопируйте ваш код сохранения вручную:', encoded);
                });
            });

            // Логика импорта
            document.getElementById('import-btn').addEventListener('click', () => {
                const encoded = prompt('Вставьте код прогресса, который вы экспортировали ранее:');
                if (!encoded) return;
                try {
                    const decoded = decodeURIComponent(atob(encoded));
                    JSON.parse(decoded); // Проверка на валидность JSON
                    localStorage.setItem('ai_hub_progress', decoded);
                    alert('✅ Прогресс успешно загружен!');
                    buildQueue();
                } catch (e) {
                    alert('❌ Ошибка импорта! Неверный формат кода.');
                }
            });

            document.getElementById('show-answer-btn').addEventListener('click', flipCard);

            buildQueue();
        }

        function buildQueue() {
            const deck = RAW_DECKS.find(d => d.id === currentDeckId);
            const now = Date.now();
            
            todayQueue = deck.cards.filter(card => {
                const stats = getCardStats(currentDeckId, card.id);
                return stats.nextReview <= now;
            });

            todayQueue.sort(() => Math.random() - 0.5);
            updateStatsUI();
            nextCard();
        }

        function updateStatsUI() {
            document.getElementById('queue-count').textContent = todayQueue.length;
        }

        function nextCard() {
            const workspace = document.getElementById('workspace');
            
            if (todayQueue.length === 0) {
                workspace.innerHTML = `<div class="empty-state"><h3>Отличная работа!</h3><p>Вы повторили все карточки в этой колоде на сегодня.</p></div>`;
                return;
            }

            currentCard = todayQueue[0];
            isFlipped = false;
            
            const cardEl = document.getElementById('flashcard');
            if(cardEl) cardEl.classList.remove('flipped');
            
            document.getElementById('show-answer-btn').style.display = 'block';
            document.getElementById('sm2-buttons').style.display = 'none';
            document.getElementById('draft-input').value = '';

            const frontText = isReverseMode ? currentCard.back : currentCard.front;
            const backText = isReverseMode ? currentCard.front : currentCard.back;

            document.getElementById('front-text').textContent = frontText;
            document.getElementById('back-text').textContent = backText;
            
            updateButtonLabels();
        }

        function updateButtonLabels() {
            const stats = getCardStats(currentDeckId, currentCard.id);
            const buttons = document.querySelectorAll('.btn-sm2');
            buttons[0].innerHTML = `Снова<br>(<10м)`;
            buttons[1].innerHTML = `Трудно<br>(${calculateInterval(stats, 1)})`;
            buttons[2].innerHTML = `Хорошо<br>(${calculateInterval(stats, 2)})`;
            buttons[3].innerHTML = `Легко<br>(${calculateInterval(stats, 3)})`;
        }

        function flipCard() {
            if (!currentCard) return;
            isFlipped = true;
            document.getElementById('flashcard').classList.add('flipped');
            document.getElementById('show-answer-btn').style.display = 'none';
            document.getElementById('sm2-buttons').style.display = 'flex';
        }

        window.handleRating = function(rating) {
            updateCardStats(currentDeckId, currentCard.id, rating);
            
            if (rating === 0) {
                todayQueue.push(todayQueue.shift());
            } else {
                todayQueue.shift();
            }
            
            updateStatsUI();
            document.getElementById('flashcard').classList.remove('flipped');
            setTimeout(nextCard, 150); 
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && currentCard && document.activeElement.tagName !== 'TEXTAREA') {
                e.preventDefault();
                if (!isFlipped) flipCard();
            }
            if (isFlipped) {
                if (e.key === '1') handleRating(0);
                if (e.key === '2') handleRating(1);
                if (e.key === '3') handleRating(2);
                if (e.key === '4') handleRating(3);
            }
        });

        initApp();
    </script>
</body>
</html>
